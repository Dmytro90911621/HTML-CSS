<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        *{
            margin: 0;
        }
        .parent{
            display: grid;
            height: 100vh;
            background: #1aaeae;
            /*width: 50vw;
            grid-template-columns: 33.3% 33.4% 33.3%;*/
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: 1fr 2fr 1fr;
            gap: 50px;
        }
        .item{
            border: 1px solid red;
            background: yellow;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .parent div:nth-child(4){
            background: green;
        }
    </style>
</head>
<body>
<div class="parent">
    <div class="item">
        <p>Lorem ipsum dolor sit.</p>
    </div>
    <div class="item"></div>
    <div class="item" ></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item" ></div>
    <div class="item"></div>
    <div class="item"></div>
</div>
</body>
</html>
